name = "private-share-link"
main = "../../worker.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [
  { pattern = "share.keysi.dev/api", zone_name = "keysi.dev" },
  { pattern = "share.keysi.dev/api/*", zone_name = "keysi.dev" },
]

[[d1_databases]]
binding = "DB"
database_name = "shares"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

[[ratelimits]]
name = "SHARE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = false

[vars]
SITE_ORIGIN = "https://share.keysi.dev"
GITHUB_CLIENT_ID = ""
